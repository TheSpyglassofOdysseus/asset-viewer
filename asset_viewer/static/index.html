<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Asset Viewer</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">AV</div>
      <div><strong>Asset Viewer</strong><span id="summary">Loading…</span></div>
    </div>
    <div class="tools">
      <select id="collection" aria-label="Collection"></select>
      <select id="filter" aria-label="Review status">
        <option value="all">All images</option>
        <option value="unreviewed">Unreviewed</option>
        <option value="approved">Approved</option>
        <option value="maybe">Maybe</option>
        <option value="rejected">Rejected</option>
      </select>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>
  <main>
    <div id="empty" class="empty hidden">
      <strong>No images in this view.</strong>
      <span>Register a folder with <code>asset-viewer add /path/to/images</code>.</span>
    </div>
    <div id="grid" class="grid"></div>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Image review">
    <button class="icon-button close" id="close" type="button" aria-label="Close">×</button>
    <button class="icon-button nav prev" id="prev" type="button" aria-label="Previous image">‹</button>
    <section class="stage">
      <img id="full" alt="">
      <div class="meta">
        <div class="identity"><strong id="filename"></strong><span id="details"></span></div>
        <div class="review">
          <button class="approve" data-status="approved" type="button">✓ Approve</button>
          <button class="maybe" data-status="maybe" type="button">? Maybe</button>
          <button class="reject" data-status="rejected" type="button">× Reject</button>
          <button data-status="" type="button">Clear</button>
          <a id="original" target="_blank" rel="noreferrer">Open original</a>
        </div>
      </div>
    </section>
    <button class="icon-button nav next" id="next" type="button" aria-label="Next image">›</button>
  </div>
  <script src="/app.js"></script>
</body>
</html>
