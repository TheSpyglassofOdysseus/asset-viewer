name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . build bandit pip-audit
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(python -c 'from asset_viewer import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION" || {
            echo "Release tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }
      - run: python -m unittest discover -v
      - run: python -m compileall -q asset_viewer tests
      - run: node --check asset_viewer/static/app.js
      - run: bandit -r asset_viewer
      - run: pip-audit -r requirements-release.txt
      - run: git diff --check
      - run: python -m build
      - name: Smoke-test built wheel in a clean environment
        run: |
          python -m venv /tmp/asset-viewer-release-smoke
          /tmp/asset-viewer-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/asset-viewer-release-smoke/bin/pip install dist/local_asset_viewer-*.whl playwright
          /tmp/asset-viewer-release-smoke/bin/python -m pip check
          test "$(/tmp/asset-viewer-release-smoke/bin/asset-viewer --version)" = "asset-viewer ${GITHUB_REF_NAME#v}"
          /tmp/asset-viewer-release-smoke/bin/python -m playwright install --with-deps chromium
          /tmp/asset-viewer-release-smoke/bin/python tests/browser_smoke.py
      - run: pip-audit -r requirements-release.txt -f cyclonedx-json -o dist/asset-viewer-sbom.cdx.json
      - run: |
          cd dist
          sha256sum local_asset_viewer-* asset-viewer-sbom.cdx.json > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/local_asset_viewer-*.whl \
            dist/local_asset_viewer-*.tar.gz \
            dist/asset-viewer-sbom.cdx.json \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Asset Viewer $GITHUB_REF_NAME"
