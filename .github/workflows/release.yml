name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build pip-audit
      - run: python -m build
      - run: pip-audit -r requirements-release.txt -f cyclonedx-json -o dist/asset-viewer-sbom.cdx.json
      - run: |
          cd dist
          sha256sum local_asset_viewer-* asset-viewer-sbom.cdx.json > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/local_asset_viewer-*.whl \
            dist/local_asset_viewer-*.tar.gz \
            dist/asset-viewer-sbom.cdx.json \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Asset Viewer $GITHUB_REF_NAME"
