name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . bandit pip-audit
      - run: bandit -r asset_viewer
      - run: pip-audit -r requirements-release.txt
      - run: pip-audit -r requirements-release.txt -f cyclonedx-json -o asset-viewer-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asset-viewer-sbom-${{ github.sha }}
          path: asset-viewer-sbom.cdx.json
          if-no-files-found: error
